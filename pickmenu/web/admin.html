<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>픽메뉴 관리자</title><link rel="icon" href="/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script>
</head>
<body>
<header class="top"><a href="/" class="brand"><img src="/mark.svg" alt="">픽메뉴 <span>ADMIN</span></a><div class="who"><span id="who"></span><button type="button" id="logout" hidden>로그아웃</button></div></header>
<main>
<section id="login" hidden>
  <h1>관리자 로그인</h1>
  <p class="muted">관리자 권한이 있는 계정만 들어올 수 있어요.</p>
  <form id="login-form"><label>아이디<input name="username" autocomplete="username" required maxlength="20"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="64"></label><button type="submit" class="primary">로그인</button><p id="login-status" class="error" role="status"></p></form>
</section>
<section id="denied" hidden><h1>접근 권한 없음</h1><p class="muted" id="denied-text"></p></section>
<section id="app" hidden>
  <nav class="tabs" role="tablist">
    <button type="button" data-tab="dashboard" class="on">사용 현황</button>
    <button type="button" data-tab="chats">AI 결과 검수</button>
    <button type="button" data-tab="feedback">피드백·신고</button>
    <button type="button" data-tab="ai">AI 운영 로그</button>
    <button type="button" data-tab="menus">메뉴 관리</button>
    <button type="button" data-tab="audit">변경 이력</button>
  </nav>
  <div id="panel"></div>
</section>
</main>
</body>
</html>
